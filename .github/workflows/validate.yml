name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "Checking JSON files..."
          find . -name '*.json' -not -path './node_modules/*' | while read f; do
            jq empty "$f" || { echo "❌ Invalid JSON: $f"; exit 1; }
          done
          echo "✅ All JSON files valid"

      - name: Check bash syntax
        run: |
          echo "Checking shell scripts..."
          find . -name '*.sh' -not -path './node_modules/*' | while read f; do
            bash -n "$f" || { echo "❌ Syntax error: $f"; exit 1; }
          done
          echo "✅ All scripts pass syntax check"

      - name: Check for Mind MCP remnants
        run: |
          echo "Checking for mind_recall/mind_log references..."
          if grep -r 'mind_recall\|mind_log\|Mind MCP' --include='*.md' --include='*.sh' --include='*.json' . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "❌ Found Mind MCP references — these should be removed"
            exit 1
          fi
          echo "✅ No Mind MCP remnants found"

      - name: Verify skills have SKILL.md
        run: |
          echo "Checking skills directories..."
          failed=0
          for dir in .claude/skills/*/; do
            [ -d "$dir" ] || continue
            if [ ! -f "${dir}SKILL.md" ]; then
              echo "❌ Missing SKILL.md in $dir"
              failed=1
            fi
          done
          [ $failed -eq 0 ] && echo "✅ All skills have SKILL.md"
          exit $failed

      - name: Telemetry/privacy — guard log never leaks secrets
        run: bash scripts/test-guard-no-leak.sh

  check-resolvable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check every skill reference resolves
        run: bash scripts/check-resolvable.sh

  trigger-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Trigger routing regression (floor from baseline)
        run: bash scripts/trigger-evals.sh

  e2e-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproducible e2e install test (no claude smoke)
        run: bash scripts/e2e-install-test.sh

  workflows-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Workflow/skill 1:1 map + prose & config skill-count drift
        run: bash scripts/validate-workflows.sh

      - name: Skills have required sections
        run: bash scripts/validate-skills.sh

  loop-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LP-06/07 loop-kernel <-> Cortex control-plane tests
        run: bash scripts/test-loop-kernel-cortex.sh

      - name: LP-09 workflow-loop tests (incl. gate-timeout fallback regression)
        run: bash scripts/test-workflow-loop.sh

  loop-kernel-macos:
    # macOS runners ship neither GNU timeout nor gtimeout, so the _exec_gate
    # no-timeout fallback branch runs for real here — the exact path that
    # ubuntu (GNU coreutils) never exercises. Guards the gate-timeout bug from
    # silently regressing on the primary macOS dev platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: LP-09 workflow-loop tests on macOS (native no-timeout fallback)
        run: bash scripts/test-workflow-loop.sh

      - name: LP-06/07 loop-kernel <-> Cortex control-plane tests on macOS
        run: bash scripts/test-loop-kernel-cortex.sh

  doctrine-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate doctrine from single source (VERSION + templates/doctrine/)
        run: bash scripts/generate-doctrine.sh

      - name: Fail if regeneration produced an uncommitted diff
        run: |
          if ! git diff --exit-code; then
            echo "❌ Doctrine drift: a generated file is out of sync with templates/doctrine/ or VERSION."
            echo "   Run 'bash scripts/generate-doctrine.sh' locally and commit the result."
            exit 1
          fi
          echo "✅ Doctrine in sync — no drift"
